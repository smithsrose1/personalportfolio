<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio-Studio</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <!-- Tiny screen that pops up to request for audio permission -->
    <div id="audio-permission-screen" class="audio-permission-screen">
        <div class="audio-permission-content">
            <h2>Welcome</h2>
            <p>Grab your headphones and be ready for an immersive experience.</p>
            <button id="enable-audio-button">Enter Gallery</button>
        </div>
    </div>


    <!-- The main gallery -->
    <div id="main-gallery" style="display:none;">
        <section id="ArtGallery">
            <div class="gallery">
                <div class = "gallery-header">
                    <a href="index.html#Art" class="back-button">← Exit</a>
                    <h1 class="gallery-title">The Rose Gallery</h1>
                    <div class="audio-controls">
                        <img src="assets/ninacropped.jpeg" alt="Current Track" id="current-track-art">
                        <div class="audio-info">
                            <span id="track-name">I Put a Spell on You - Nina Simone</span>
                            <div class="buttons">
                                <button id="play-pause">▶️</button>
                                <input type="range" id="volume" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="spotlight"></div>

                <div class="conveyor-container">
                    <div class="conveyor-track" id="carousel-track"></div>
                </div>

                <div class="info-display">
                    <div class="info-title" id="current-title"></div>
                    <div class="info-artist" id="current-artist"></div>
                </div>

                <div class="hint">Click any artwork to explore</div>
            </div>

            <div class="modal-overlay" id="modal">
                <button class="modal-close" id="modal-close">×</button>
                <div class="modal-content">
                    <div class="modal-image-container">
                        <img class="modal-image" id="modal-image" src="" alt="">
                    </div>
                    <div class="modal-info">
                        <h2 class="modal-title" id="modal-title"></h2>
                        <p class="modal-artist" id="modal-artist"></p>
                        <div class="modal-divider"></div>
                        <p class="modal-description" id="modal-description"></p>
                        <p class="modal-size" id="modal-size"> </p>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <audio id="audio-player" loop>
        <source src="assets/gallery-track.mp3" type="audio/mpeg">
    </audio>

    <script src="gallery.js"></script>
</body>
</html>
